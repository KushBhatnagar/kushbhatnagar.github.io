name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      # Compare the new build's /posts.json with the live one (fetched BEFORE this deploy) to find newly
      # published posts. Sends nothing by itself; the notify job emails them after the deploy.
      - name: Detect newly published posts
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/kit_notify_posts.py plan public/posts.json "${{ runner.temp }}/new-posts.json"
      - name: Keep the list for the notify job
        uses: actions/upload-artifact@v4
        with:
          name: new-posts
          path: ${{ runner.temp }}/new-posts.json
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Email each newly published post to Kit subscribers (docs/NEWSLETTER.md).
  # Off until the repository variable KIT_POSTS_ENABLED is "true"; test mode while KIT_TEST_TAG_ID is set;
  # dry run (prints the email) unless KIT_SEND is "true".
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: vars.KIT_POSTS_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get the list of new posts
        uses: actions/download-artifact@v4
        with:
          name: new-posts
          path: ${{ runner.temp }}
      - name: Email new posts via Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
          KIT_TEST_TAG_ID: ${{ vars.KIT_TEST_TAG_ID }}
          KIT_FROM_EMAIL: ${{ vars.KIT_FROM_EMAIL }}
          KIT_SEND: ${{ vars.KIT_SEND }}
        run: python3 scripts/kit_notify_posts.py send "${{ runner.temp }}/new-posts.json"
