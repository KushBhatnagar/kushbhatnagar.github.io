# Copy this file to the Digital-Dhaba repo as .github/workflows/publish-to-blog.yml
# (setup steps: docs/TECH_DIGEST.md in the blog repo).
#
# When a new issue (issues/YYYY-MM-DD/newsletter.html + digest.json) is pushed to Digital-Dhaba,
# this imports it into blogsbykush.com with scripts/add_digest.py and pushes to the blog's
# branch, which triggers the site deploy. Fully automatic: no PR, no manual step.
name: Publish issue to blogsbykush.com

on:
  push:
    branches: [main]
    paths:
      - "issues/*/newsletter.html"
      - "issues/*/digest.json"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue folder to (re)publish, e.g. 2026-09-27 (blank = latest)"
        required: false

permissions:
  contents: read

concurrency:
  group: publish-to-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BLOG_REPO: KushBhatnagar/kushbhatnagar.github.io
      # Use hugo-migration until the Hugo site is live on main, then switch to main.
      BLOG_BRANCH: main
    steps:
      - name: Checkout Digital-Dhaba
        uses: actions/checkout@v4
        with:
          path: dhaba
          fetch-depth: 0

      - name: Work out which issues to publish
        id: issues
        working-directory: dhaba
        env:
          INPUT_ISSUE: ${{ inputs.issue }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_ISSUE" ]; then
            list="issues/$INPUT_ISSUE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            list=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'issues/*/newsletter.html' 'issues/*/digest.json' \
                   | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          fi
          [ -z "${list:-}" ] && list="issues/$(ls issues | sort | tail -1)"
          echo "Publishing: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Checkout blog
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_REPO }}
          ref: ${{ env.BLOG_BRANCH }}
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog

      - name: Import issue(s)
        env:
          LIST: ${{ steps.issues.outputs.list }}
        run: |
          for dir in $LIST; do
            python3 blog/scripts/add_digest.py "dhaba/$dir"
          done

      - name: Commit and push to the blog
        working-directory: blog
        env:
          LIST: ${{ steps.issues.outputs.list }}
        run: |
          git config user.name "Digital Dhaba bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/tech-digest
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Tech Digest: publish $(echo $LIST | sed 's#issues/##g')"
          git push origin "HEAD:$BLOG_BRANCH"
